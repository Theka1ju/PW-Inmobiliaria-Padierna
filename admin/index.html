<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | Alquiladora GM Padierna</title>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        [class*="AppHeaderContent"] {
            background-color: #1E3D9A !important;
        }

        button[class*="SaveButton"] {
            background-color: #10B981 !important;
            font-weight: bold !important;
        }

        [class*="SplitPane"] > div:last-child {
            display: none !important;
        }
        [class*="SplitPane"] > div:first-child {
            width: 100% !important;
        }

        /* Estilo para las imágenes recuperadas directamente */
        .custom-img-card {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            background: #ffffff;
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .custom-img-thumb {
            width: 110px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
        }
        .custom-img-btn {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
        CMS.registerLocale('es', {
            auth: {
                login: 'Iniciar Sesión',
                loggingIn: 'Iniciando sesión...',
                loginWithNetlifyIdentity: 'Entrar con correo y contraseña'
            },
            editor: {
                editorToolbar: {
                    publish: 'Guardar Cambios en la Web',
                    publishing: 'Guardando...',
                    published: 'Cambios Guardados'
                }
            }
        });

        // Inyección directa sobre el DOM: toma la URL del estado React de Decap
        function repararImagenes() {
            const images = document.querySelectorAll('img[src^="blob:"]');
            images.forEach(img => {
                try {
                    // Buscar la instancia interna de React
                    const reactKey = Object.keys(img).find(k => k.startsWith('__reactFiber') || k.startsWith('__reactInternalInstance'));
                    if (!reactKey) return;

                    let fiber = img[reactKey];
                    let rawPath = null;

                    // Subir por el árbol de componentes para recuperar el prop value del widget de imagen
                    while (fiber && !rawPath) {
                        if (fiber.memoizedProps) {
                            const props = fiber.memoizedProps;
                            if (typeof props.value === 'string' && props.value.length > 0) {
                                rawPath = props.value;
                            } else if (props.entry && props.entry.get) {
                                // En caso de estar en el nivel de entrada
                            }
                        }
                        fiber = fiber.return;
                    }

                    if (rawPath) {
                        const cleanUrl = rawPath.startsWith('/') ? rawPath : '/' + rawPath;
                        if (img.getAttribute('data-fixed-src') !== cleanUrl) {
                            img.src = cleanUrl;
                            img.setAttribute('data-fixed-src', cleanUrl);
                            img.style.objectFit = 'contain';
                            img.style.backgroundColor = '#ffffff';
                        }
                    }
                } catch (e) {
                    console.error("Error resolviendo ruta de imagen:", e);
                }
            });
        }

        // Ejecutar revisión periódica constante
        setInterval(repararImagenes, 400);
    </script>
</body>

</html>
