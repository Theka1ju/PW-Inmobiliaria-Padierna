<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | Alquiladora GM Padierna</title>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        [class*="AppHeaderContent"] {
            background-color: #1E3D9A !important;
        }

        button[class*="SaveButton"] {
            background-color: #10B981 !important;
            font-weight: bold !important;
        }

        [class*="SplitPane"] > div:last-child {
            display: none !important;
        }
        [class*="SplitPane"] > div:first-child {
            width: 100% !important;
        }

        /* Fuerza a que el contenedor de la imagen muestre fondo limpio y proporción */
        [class*="StyledImage"],
        img[role="presentation"] {
            object-fit: contain !important;
            background-color: #f8fafc !important;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            min-height: 80px;
        }
    </style>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
        CMS.registerLocale('es', {
            auth: {
                login: 'Iniciar Sesión',
                loggingIn: 'Iniciando sesión...',
                loginWithNetlifyIdentity: 'Entrar con correo y contraseña'
            },
            editor: {
                editorToolbar: {
                    publish: 'Guardar Cambios en la Web',
                    publishing: 'Guardando...',
                    published: 'Cambios Guardados'
                }
            }
        });

        // Observer que toma la ruta de la imagen y sustituye el blob vacío por la ruta estática
        setInterval(() => {
            const wrappers = document.querySelectorAll('img[src^="blob:"]');
            wrappers.forEach(img => {
                if (img.naturalWidth === 0) {
                    const row = img.closest('[class*="ListItemControl"]') || img.closest('[class*="ControlContainer"]');
                    if (row) {
                        const rawText = row.innerText || '';
                        const match = rawText.match(/img\/[a-zA-Z0-9_\-\.\(\)\s]+\.(?:jpeg|jpg|png|webp)/i);
                        if (match) {
                            img.src = '/' + match[0].replace(/^\/+/, '');
                        }
                    }
                }
            });
        }, 500);
    </script>
</body>

</html>
