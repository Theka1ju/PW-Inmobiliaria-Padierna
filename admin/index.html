<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | Alquiladora GM Padierna</title>

    <!-- Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        /* Ocultar botones técnicos que puedan asustar o causar accidentes */
        /* Oculta la vista dividida Markdown/Preview técnica innecesaria */
        [class*="SplitPane"]>div:last-child {
            display: none !important;
        }

        [class*="SplitPane"]>div:first-child {
            width: 100% !important;
        }

        /* Estilizar la barra superior */
        [class*="AppHeaderContent"] {
            background-color: #1E3D9A !important;
        }

        /* Resaltar el botón Guardar */
        button[class*="SaveButton"] {
            background-color: #10B981 !important;
            font-size: 14px !important;
            font-weight: bold !important;
            border-radius: 8px !important;
        }

        /* Transforma la tarjeta abierta en un cuadro enfocado y limpio */
        [class*="ListItemControl"]:focus-within {
            background: #ffffff !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15) !important;
            border: 2px solid #1E3D9A !important;
            border-radius: 12px !important;
            padding: 12px !important;
        }
    </style>
</head>

<body>
    <!-- Carga del CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Configuración de Idioma Español -->
    <script>
        CMS.registerLocale('es', {
            auth: {
                login: 'Iniciar Sesión',
                loggingIn: 'Iniciando sesión...',
                loginWithNetlifyIdentity: 'Entrar con correo y contraseña'
            },
            app: {
                header: {
                    quickAdd: 'Crear nuevo'
                }
            },
            collection: {
                collectionTop: {
                    sortByLabel: 'Ordenar por',
                    viewAs: 'Vista'
                },
                entries: {
                    emptyCollection: 'No hay elementos registrados'
                }
            },
            editor: {
                editorControlPane: {
                    widget: {
                        list: {
                            add: '+ Agregar nuevo producto'
                        }
                    }
                },
                editorToolbar: {
                    publish: 'Guardar Cambios en la Web',
                    publishing: 'Guardando...',
                    published: 'Cambios Guardados'
                }
            }
        });
    </script>
</body>

</html>
