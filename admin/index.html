<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | Alquiladora GM Padierna</title>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        [class*="AppHeaderContent"] {
            background-color: #1E3D9A !important;
        }

        button[class*="SaveButton"] {
            background-color: #10B981 !important;
            font-weight: bold !important;
        }

        [class*="SplitPane"] > div:last-child {
            display: none !important;
        }
        [class*="SplitPane"] > div:first-child {
            width: 100% !important;
        }

        /* Estilo para que la imagen se vea limpia y centrada */
        [class*="StyledImage"],
        img[role="presentation"] {
            object-fit: contain !important;
            background-color: #ffffff !important;
            min-height: 80px;
        }
    </style>
</head>

<body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
        CMS.registerLocale('es', {
            auth: {
                login: 'Iniciar Sesión',
                loggingIn: 'Iniciando sesión...',
                loginWithNetlifyIdentity: 'Entrar con correo y contraseña'
            },
            editor: {
                editorToolbar: {
                    publish: 'Guardar Cambios en la Web',
                    publishing: 'Guardando...',
                    published: 'Cambios Guardados'
                }
            }
        });

        // Script para arreglar los blobs rotos de Git Gateway:
        // Decap guarda en el input o en el estado el nombre del archivo (ej. img/carpa.jpeg).
        // Si la imagen tiene un src que comienza con "blob:" pero no cargó ancho real (naturalWidth === 0),
        // este script la redirige a su URL estática de Netlify.
        setInterval(() => {
            const images = document.querySelectorAll('img[src^="blob:"]');
            images.forEach(img => {
                if (img.naturalWidth === 0) {
                    // Buscar el contenedor del control de la imagen
                    const container = img.closest('[class*="ControlContainer"]') || img.closest('[class*="ListItemControl"]');
                    if (container) {
                        // Buscar inputs o botones con la ruta
                        const textContent = container.innerText;
                        const match = textContent.match(/img\/[^\s\n\r]+\.(?:jpg|jpeg|png|webp)/i);
                        if (match) {
                            img.src = '/' + match[0].replace(/^\/+/, '');
                        }
                    }
                }
            });
        }, 500);
    </script>
</body>

</html>
