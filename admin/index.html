<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | Alquiladora GM Padierna</title>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        /* Barra de navegación */
        [class*="AppHeaderContent"] {
            background-color: #1E3D9A !important;
        }

        /* Botón de guardar destacado */
        button[class*="SaveButton"] {
            background-color: #10B981 !important;
            font-weight: bold !important;
        }

        /* Ocultar el panel de previsualización lateral innecesario */
        [class*="SplitPane"] > div:last-child {
            display: none !important;
        }
        [class*="SplitPane"] > div:first-child {
            width: 100% !important;
        }

        /* Miniatura personalizada */
        .preview-cms-img {
            max-width: 180px;
            max-height: 120px;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            margin-top: 8px;
            display: block;
            background-color: #f8fafc;
            padding: 4px;
        }
    </style>
</head>

<body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
        // Traducción al español
        CMS.registerLocale('es', {
            auth: {
                login: 'Iniciar Sesión',
                loggingIn: 'Iniciando sesión...',
                loginWithNetlifyIdentity: 'Entrar con correo y contraseña'
            },
            editor: {
                editorToolbar: {
                    publish: 'Guardar Cambios en la Web',
                    publishing: 'Guardando...',
                    published: 'Cambios Guardados'
                }
            }
        });

        // Reemplazar dinámicamente cualquier blob fallido con la imagen estática real
        setInterval(() => {
            const blobs = document.querySelectorAll('img[src^="blob:"]');
            blobs.forEach(img => {
                // Si la imagen de blob no tiene dimensiones reales cargadas
                if (img.naturalWidth === 0) {
                    // Buscar el contenedor de la tarjeta
                    const card = img.closest('[class*="ControlContainer"]') || img.closest('[class*="ListItemControl"]');
                    if (card) {
                        // Buscar el texto o valor de la ruta en la tarjeta o inputs ocultos
                        const textNodes = card.innerText || '';
                        const match = textNodes.match(/img\/[a-zA-Z0-9_\-\.\(\)\s]+\.(?:jpeg|jpg|png|webp)/i);
                        if (match) {
                            const realPath = '/' + match[0].replace(/^\/+/, '');
                            img.src = realPath;
                            img.style.objectFit = 'contain';
                            img.style.maxWidth = '160px';
                            img.style.maxHeight = '110px';
                        }
                    }
                }
            });
        }, 800);
    </script>
</body>

</html>
